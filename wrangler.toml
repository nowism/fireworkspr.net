# Cloudflare Worker + static assets for www.fireworkspr.net
name = "fireworkspr-net"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Preview at https://fireworkspr-net.<account>.workers.dev before DNS moves.
workers_dev = true
preview_urls = true

# Custom domains (www.fireworkspr.net and fireworkspr.net) are attached in the
# dashboard: Worker -> Domains -> Add Domain, once the zone is Active.

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true  # so the apex -> www redirect runs for every path

# Contact form delivery. Needs Email Routing enabled on fireworkspr.net with
# this address verified as a destination (see README). All other mail to
# @fireworkspr.net is forwarded there by an Email Routing catch-all rule.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "amybessette@icloud.com"

[vars]
CONTACT_TO = "amybessette@icloud.com"
CONTACT_FROM = "website@fireworkspr.net"
